<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RecMan To Do</title>
    <!--
      Single-Page Apps for GitHub Pages — SPA redirect
      https://github.com/rafgraph/spa-github-pages

      When GitHub Pages can't find a file it serves this 404.html instead.
      The script below encodes the current path + search + hash into a query
      string and redirects to the root index.html, which then decodes it and
      restores the original URL via history.replaceState.

      pathSegmentsToKeep = 1  →  keeps /RecMan-TO-DO-app (the project-site prefix)
    -->
    <script>
      const pathSegmentsToKeep = 1;
      const l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search
            ? "&" + l.search.slice(1).replace(/&/g, "~and~")
            : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
